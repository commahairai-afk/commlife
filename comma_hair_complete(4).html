<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CommaHair 員工平台 2026</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { 
      font-family: 'Noto Sans TC', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', sans-serif;
      background: #f8fafc;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo } = React;

// ==================== 全職助理組件 ====================
const FullTimeAssistantCalculator = ({ onBack }) => {
  const BASE_SALARY = 29500;
  const ALLOWANCE_AMOUNT = 2500;
  
  const MONTHLY_BONUS_LEVELS = [
    { threshold: 32000, bonus: 2500, label: 'L3 (高階)' },
    { threshold: 29500, bonus: 1500, label: 'L2 (中階)' },
    { threshold: 25000, bonus: 500, label: 'L1 (基本)' },
  ];

  const YEAR_END_LEVELS = [
    { threshold: 390000, bonus: 30500, label: '第六階 (巔峰級)' },
    { threshold: 380000, bonus: 29500, label: '第五階 (全額底薪)' },
    { threshold: 340000, bonus: 21000, label: '第四階' },
    { threshold: 330000, bonus: 14500, label: '第三階' },
    { threshold: 310000, bonus: 9000, label: '第二階' },
    { threshold: 290000, bonus: 5000, label: '第一階' },
  ];

  const [personalPerformance, setPersonalPerformance] = useState(35000);
  const [annualPerformance, setAnnualPerformance] = useState(400000);
  const [hasAllowance, setHasAllowance] = useState(true);

  const calculations = useMemo(() => {
    const safePersonalPerformance = Number(personalPerformance) || 0;
    const safeAnnualPerformance = Number(annualPerformance) || 0;

    let achievementBonus = 0;
    let currentLevel = '未達標';
    let nextLevel = null;

    const sortedMonthly = [...MONTHLY_BONUS_LEVELS].sort((a, b) => b.threshold - a.threshold);
    for (const level of sortedMonthly) {
      if (safePersonalPerformance >= level.threshold) {
        achievementBonus = level.bonus;
        currentLevel = level.label;
        break;
      }
    }
    for (let i = sortedMonthly.length - 1; i >= 0; i--) {
      if (safePersonalPerformance < sortedMonthly[i].threshold) {
        nextLevel = sortedMonthly[i];
        break;
      }
    }

    const excessThreshold = 29500;
    const excessPerformance = Math.max(0, safePersonalPerformance - excessThreshold);
    const excessBonus = excessPerformance;

    let baseYearEndBonus = 0;
    let currentYearEndLevel = '未達標';
    let nextYearEndLevel = null;

    const sortedYearly = [...YEAR_END_LEVELS].sort((a, b) => b.threshold - a.threshold);
    for (const level of sortedYearly) {
      if (safeAnnualPerformance >= level.threshold) {
        baseYearEndBonus = level.bonus;
        currentYearEndLevel = level.label;
        break;
      }
    }
    for (let i = sortedYearly.length - 1; i >= 0; i--) {
      if (safeAnnualPerformance < sortedYearly[i].threshold) {
        nextYearEndLevel = sortedYearly[i];
        break;
      }
    }

    const yearEndExcessThreshold = 390000;
    const yearEndExcessPerformance = Math.max(0, safeAnnualPerformance - yearEndExcessThreshold);
    const yearEndExcessBonus = yearEndExcessPerformance * 0.06;
    const totalYearEndBonus = baseYearEndBonus + yearEndExcessBonus;

    const currentAllowance = hasAllowance ? ALLOWANCE_AMOUNT : 0;
    const totalMonthlySalary = BASE_SALARY + currentAllowance + achievementBonus + excessBonus;

    return {
      achievementBonus, currentLevel, nextLevel, excessPerformance, excessBonus,
      currentAllowance, totalMonthlySalary, baseYearEndBonus, yearEndExcessPerformance,
      yearEndExcessBonus, totalYearEndBonus, currentYearEndLevel, nextYearEndLevel
    };
  }, [personalPerformance, annualPerformance, hasAllowance]);

  return (
    <div style={{ maxWidth: '1200px', margin: '0 auto', padding: '24px 16px' }}>
      <button onClick={onBack} style={{ background: 'none', border: 'none', color: '#4f46e5', cursor: 'pointer', fontSize: '14px', fontWeight: '500', marginBottom: '24px' }}>
        ← 返回職位選擇
      </button>

      <div style={{ background: 'linear-gradient(to right, #e0e7ff, #f8fafc)', borderRadius: '16px', padding: '24px', border: '1px solid #c7d2fe', marginBottom: '24px' }}>
        <h2 style={{ fontSize: '24px', fontWeight: 'bold', marginBottom: '8px' }}>全職助理薪資試算</h2>
        <p style={{ color: '#4b5563' }}>非在校生 · 月獎金 + 年終獎金 + 6% 超額提撥</p>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(400px, 1fr))', gap: '24px', marginBottom: '24px' }}>
        <div>
          <div style={{ background: 'white', borderRadius: '12px', padding: '20px', border: '1px solid #e2e8f0', marginBottom: '20px' }}>
            <h3 style={{ fontSize: '18px', fontWeight: 'bold', marginBottom: '16px' }}>本月績效設定</h3>
            
            <div style={{ marginBottom: '16px' }}>
              <label style={{ display: 'block', fontSize: '12px', fontWeight: '700', color: '#64748b', marginBottom: '8px' }}>個人單月實績 (NT$)</label>
              <div style={{ position: 'relative' }}>
                <span style={{ position: 'absolute', left: '12px', top: '50%', transform: 'translateY(-50%)', color: '#cbd5e1', fontSize: '20px' }}>$</span>
                <input 
                  type="number" 
                  value={personalPerformance}
                  onChange={(e) => { const v = e.target.value; setPersonalPerformance(v === "" ? "" : parseFloat(v) || 0); }}
                  style={{ width: '100%', fontSize: '20px', fontWeight: '900', padding: '12px 12px 12px 36px', background: '#f1f5f9', border: '2px solid transparent', borderRadius: '8px', outline: 'none', boxSizing: 'border-box' }}
                  onFocus={(e) => e.target.style.borderColor = '#4f46e5'}
                  onBlur={(e) => e.target.style.borderColor = 'transparent'}
                />
              </div>
            </div>

            <button 
              onClick={() => setHasAllowance(!hasAllowance)}
              style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px', padding: '12px', borderRadius: '8px', fontSize: '14px', fontWeight: 'bold', border: 'none', cursor: 'pointer', background: hasAllowance ? '#4f46e5' : '#f1f5f9', color: hasAllowance ? 'white' : '#64748b', transition: 'all 0.2s' }}
            >
              {hasAllowance ? '✓' : '○'} 店務協助 $2,500
            </button>

            {/* 月業績達標獎勵金 L1/L2/L3 */}
            <div style={{ marginTop: '20px', paddingTop: '20px', borderTop: '1px solid #e2e8f0' }}>
              <h4 style={{ fontSize: '13px', fontWeight: 'bold', color: '#475569', marginBottom: '12px' }}>月業績達標獎勵金</h4>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '8px' }}>
                {MONTHLY_BONUS_LEVELS.slice().reverse().map((level) => {
                  const isReached = personalPerformance >= level.threshold;
                  return (
                    <div 
                      key={level.label}
                      style={{ padding: '10px', borderRadius: '8px', border: '2px solid', textAlign: 'center', background: isReached ? '#d1fae5' : '#f1f5f9', borderColor: isReached ? '#10b981' : '#e2e8f0', color: isReached ? '#065f46' : '#94a3b8' }}
                    >
                      <div style={{ fontSize: '11px', fontWeight: 'bold', marginBottom: '4px' }}>{level.label}</div>
                      <div style={{ fontSize: '10px', marginBottom: '4px' }}>${level.threshold.toLocaleString()}</div>
                      <div style={{ fontSize: '12px', fontWeight: 'bold' }}>+${level.bonus.toLocaleString()}</div>
                    </div>
                  );
                })}
              </div>
              <p style={{ fontSize: '11px', color: '#9333ea', marginTop: '8px', fontWeight: 'bold', textAlign: 'center' }}>
                目前獎金等級：{calculations.currentLevel} (+${calculations.achievementBonus.toLocaleString()})
              </p>
            </div>
          </div>

          <div style={{ background: 'white', borderRadius: '12px', padding: '20px', border: '2px solid #fbbf24', marginBottom: '20px' }}>
            <h3 style={{ fontSize: '18px', fontWeight: 'bold', marginBottom: '16px' }}>年度累積試算</h3>
            
            <div style={{ marginBottom: '16px' }}>
              <label style={{ display: 'block', fontSize: '12px', fontWeight: '700', color: '#64748b', marginBottom: '8px' }}>累積年度實績 (NT$)</label>
              <div style={{ position: 'relative' }}>
                <span style={{ position: 'absolute', left: '12px', top: '50%', transform: 'translateY(-50%)', color: '#cbd5e1', fontSize: '20px' }}>$</span>
                <input 
                  type="number" 
                  value={annualPerformance}
                  onChange={(e) => { const v = e.target.value; setAnnualPerformance(v === "" ? "" : parseFloat(v) || 0); }}
                  style={{ width: '100%', fontSize: '20px', fontWeight: '900', padding: '12px 12px 12px 36px', background: '#fef3c7', border: '2px solid transparent', borderRadius: '8px', outline: 'none', boxSizing: 'border-box' }}
                  onFocus={(e) => e.target.style.borderColor = '#fbbf24'}
                  onBlur={(e) => e.target.style.borderColor = 'transparent'}
                />
              </div>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '8px' }}>
              {[...YEAR_END_LEVELS].reverse().map((level) => (
                <div 
                  key={level.label}
                  style={{ padding: '12px', borderRadius: '8px', border: '2px solid', textAlign: 'center', background: annualPerformance >= level.threshold ? '#fef3c7' : '#f1f5f9', borderColor: annualPerformance >= level.threshold ? '#fbbf24' : '#e2e8f0', color: annualPerformance >= level.threshold ? '#92400e' : '#cbd5e1' }}
                >
                  <div style={{ fontSize: '10px', fontWeight: 'bold', marginBottom: '4px' }}>{level.label}</div>
                  <div style={{ fontSize: '12px', fontWeight: 'bold', marginBottom: '4px' }}>${(level.threshold / 10000).toLocaleString()}萬</div>
                  <div style={{ fontSize: '11px', fontWeight: 'bold' }}>${level.bonus.toLocaleString()}</div>
                </div>
              ))}
            </div>
          </div>
        </div>

        <div>
          <div style={{ background: '#1e293b', color: 'white', borderRadius: '12px', padding: '20px', marginBottom: '20px' }}>
            <p style={{ color: '#94a3b8', fontSize: '11px', fontWeight: 'bold', marginBottom: '8px' }}>本月預估月薪</p>
            <div style={{ fontSize: '32px', fontWeight: '900', marginBottom: '16px' }}>
              ${Math.round(calculations.totalMonthlySalary).toLocaleString()}
            </div>
            <div style={{ fontSize: '12px', space: '8px' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
                <span style={{ color: '#cbd5e1' }}>底薪+協助</span>
                <span>${(29500 + calculations.currentAllowance).toLocaleString()}</span>
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
                <span style={{ color: '#cbd5e1' }}>月獎金</span>
                <span style={{ color: '#4ade80' }}>+${calculations.achievementBonus.toLocaleString()}</span>
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between', borderTop: '1px solid #475569', paddingTop: '8px' }}>
                <span style={{ color: '#cbd5e1' }}>超額分紅</span>
                <span style={{ color: '#4ade80' }}>+${calculations.excessBonus.toLocaleString()}</span>
              </div>
            </div>
          </div>

          <div style={{ background: '#f59e0b', color: 'white', borderRadius: '12px', padding: '20px' }}>
            <p style={{ fontSize: '11px', fontWeight: 'bold', marginBottom: '8px' }}>年終獎金</p>
            <div style={{ fontSize: '32px', fontWeight: '900', marginBottom: '8px' }}>
              ${Math.round(calculations.totalYearEndBonus).toLocaleString()}
            </div>
            <p style={{ fontSize: '12px' }}>{calculations.currentYearEndLevel}</p>
          </div>
        </div>
      </div>
    </div>
  );
};

// ==================== 在校助理組件 ====================
const SchoolStudentCalculator = ({ onBack }) => {
  // 在校助理的月獎金等級（較低）
  const STUDENT_MONTHLY_LEVELS = [
    { threshold: 32000, bonus: 1200, label: 'L3 (高階)' },

    { threshold: 25000, bonus: 200, label: 'L1 (基本)' },
  ];

  const [personalPerformance, setPersonalPerformance] = useState(30000);
  const [hasAllowance, setHasAllowance] = useState(true);
  const [hasTuitionSubsidy, setHasTuitionSubsidy] = useState(true);

  const calculations = useMemo(() => {
    const safePersonalPerformance = Number(personalPerformance) || 0;
    
    // 計算月達標獎金（L1/L2/L3）
    let achievementBonus = 0;
    let currentLevel = '未達標';
    const sortedMonthly = [...STUDENT_MONTHLY_LEVELS].sort((a, b) => b.threshold - a.threshold);

      if (safePersonalPerformance >= level.threshold) {
        achievementBonus = level.bonus;
        currentLevel = level.label;
        break;
      }

    const excessBonus = Math.max(0, safePersonalPerformance - 29500);

    const currentTuitionSubsidy = hasTuitionSubsidy ? 1500 : 0;
    const totalMonthlySalary = 29500 + currentAllowance + currentTuitionSubsidy + achievementBonus + excessBonus;
    return { totalMonthlySalary, currentAllowance, currentTuitionSubsidy, achievementBonus, currentLevel, excessBonus };
  }, [personalPerformance, hasAllowance, hasTuitionSubsidy]);

  return (
    <div style={{ maxWidth: '1200px', margin: '0 auto', padding: '24px 16px' }}>
      <button onClick={onBack} style={{ background: 'none', border: 'none', color: '#4f46e5', cursor: 'pointer', fontSize: '14px', fontWeight: '500', marginBottom: '24px' }}>
        ← 返回職位選擇
      </button>

      <div style={{ background: 'linear-gradient(to right, #e0e7ff, #f8fafc)', borderRadius: '16px', padding: '24px', border: '1px solid #c7d2fe', marginBottom: '24px' }}>
        <h2 style={{ fontSize: '24px', fontWeight: 'bold', marginBottom: '8px' }}>在校助理薪資試算</h2>
        <p style={{ color: '#4b5563' }}>大學生/機構學生 · 包含學費補貼 $1,500</p>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(400px, 1fr))', gap: '24px' }}>
        <div style={{ background: 'white', borderRadius: '12px', padding: '20px', border: '1px solid #e2e8f0' }}>
          <h3 style={{ fontSize: '18px', fontWeight: 'bold', marginBottom: '16px' }}>本月績效與補貼</h3>
          
          <div style={{ marginBottom: '16px' }}>
            <label style={{ display: 'block', fontSize: '12px', fontWeight: '700', color: '#64748b', marginBottom: '8px' }}>個人單月實績 (NT$)</label>
            <div style={{ position: 'relative' }}>
              <span style={{ position: 'absolute', left: '12px', top: '50%', transform: 'translateY(-50%)', color: '#cbd5e1', fontSize: '20px' }}>$</span>
              <input 
                type="number" 
                value={personalPerformance}
                onChange={(e) => { const v = e.target.value; setPersonalPerformance(v === "" ? "" : parseFloat(v) || 0); }}
                style={{ width: '100%', fontSize: '20px', fontWeight: '900', padding: '12px 12px 12px 36px', background: '#f1f5f9', border: '2px solid transparent', borderRadius: '8px', outline: 'none', boxSizing: 'border-box' }}
              />
            </div>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '12px', marginBottom: '20px' }}>
            <button 
              onClick={() => setHasAllowance(!hasAllowance)}
              style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '6px', padding: '12px', borderRadius: '8px', fontSize: '12px', fontWeight: 'bold', border: hasAllowance ? '1px solid #10b981' : '1px solid #e2e8f0', background: hasAllowance ? '#d1fae5' : '#f1f5f9', color: hasAllowance ? '#065f46' : '#64748b', cursor: 'pointer' }}
            >
              {hasAllowance ? '✓' : '○'} 店務協助 $2,500
            </button>
            <button 
              onClick={() => setHasTuitionSubsidy(!hasTuitionSubsidy)}
              style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '6px', padding: '12px', borderRadius: '8px', fontSize: '12px', fontWeight: 'bold', border: hasTuitionSubsidy ? '1px solid #4f46e5' : '1px solid #e2e8f0', background: hasTuitionSubsidy ? '#e0e7ff' : '#f1f5f9', color: hasTuitionSubsidy ? '#312e81' : '#64748b', cursor: 'pointer' }}
            >
              {hasTuitionSubsidy ? '✓' : '○'} 學費補貼 $1,500
            </button>
          </div>

          {/* 月業績達標獎勵金 L1/L2/L3 */}
          <div style={{ marginTop: '20px', paddingTop: '20px', borderTop: '1px solid #e2e8f0' }}>
            <h4 style={{ fontSize: '13px', fontWeight: 'bold', color: '#475569', marginBottom: '12px' }}>月業績達標獎勵金</h4>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '8px' }}>
              {STUDENT_MONTHLY_LEVELS.slice().reverse().map((level) => {
                const isReached = personalPerformance >= level.threshold;
                return (
                  <div 
                    key={level.label}
                    style={{ padding: '10px', borderRadius: '8px', border: '2px solid', textAlign: 'center', background: isReached ? '#d1fae5' : '#f1f5f9', borderColor: isReached ? '#10b981' : '#e2e8f0', color: isReached ? '#065f46' : '#94a3b8' }}
                  >
                    <div style={{ fontSize: '11px', fontWeight: 'bold', marginBottom: '4px' }}>{level.label}</div>
                    <div style={{ fontSize: '10px', marginBottom: '4px' }}>${level.threshold.toLocaleString()}</div>
                    <div style={{ fontSize: '12px', fontWeight: 'bold' }}>+${level.bonus.toLocaleString()}</div>
                  </div>
                );
              })}
            </div>
            <p style={{ fontSize: '11px', color: '#9333ea', marginTop: '8px', fontWeight: 'bold', textAlign: 'center' }}>
              目前獎金等級：{calculations.currentLevel} (+${calculations.achievementBonus.toLocaleString()})
            </p>
          </div>
        </div>

        <div style={{ background: '#1e293b', color: 'white', borderRadius: '12px', padding: '20px' }}>
          <p style={{ color: '#94a3b8', fontSize: '11px', fontWeight: 'bold', marginBottom: '8px' }}>本月預估月薪</p>
          <div style={{ fontSize: '32px', fontWeight: '900', marginBottom: '16px' }}>
            ${Math.round(calculations.totalMonthlySalary).toLocaleString()}
          </div>
          <div style={{ fontSize: '12px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
              <span>底薪</span>
              <span>$29,500</span>
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
              <span>店務協助</span>
              <span>${calculations.currentAllowance.toLocaleString()}</span>
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
              <span>學費補貼</span>
              <span>${calculations.currentTuitionSubsidy.toLocaleString()}</span>
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px', borderTop: '1px solid #475569', paddingTop: '8px' }}>
              <span>月達標獎金 ({calculations.currentLevel})</span>
              <span style={{ color: '#4ade80' }}>+${calculations.achievementBonus.toLocaleString()}</span>
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between' }}>
              <span>超額分紅</span>
              <span style={{ color: '#4ade80' }}>+${calculations.excessBonus.toLocaleString()}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

// ==================== 助理主管組件 ====================
const ManagerCalculator = ({ onBack }) => {
  const [personalPerformance, setPersonalPerformance] = useState(35000);
  const [hasAllowance, setHasAllowance] = useState(true);
  const [hasManagerBonus, setHasManagerBonus] = useState(true);
  const [teamMembers, setTeamMembers] = useState([
    { id: 1, name: '成員 A', performance: 50000 },
    { id: 2, name: '成員 B', performance: 30000 }
  ]);

  const MONTHLY_BONUS_LEVELS = [
    { threshold: 32000, bonus: 2500, label: 'L3 (高階)' },
    { threshold: 29500, bonus: 1500, label: 'L2 (中階)' },
    { threshold: 25000, bonus: 500, label: 'L1 (基本)' },
  ];

  const calculations = useMemo(() => {
    const safePerf = Number(personalPerformance) || 0;
    
    let achievementBonus = 0;
    let currentLevel = '未達標';
    const sortedMonthly = [...MONTHLY_BONUS_LEVELS].sort((a, b) => b.threshold - a.threshold);
    for (const level of sortedMonthly) {
      if (safePerf >= level.threshold) {
        achievementBonus = level.bonus;
        currentLevel = level.label;
        break;
      }
    }

    const excessBonus = Math.max(0, safePerf - 29500);
    const teamTotalPerformance = teamMembers.reduce((sum, m) => sum + (Number(m.performance) || 0), 0);
    const teamBonus = teamTotalPerformance * 0.03;
    const currentAllowance = hasAllowance ? 2500 : 0;
    const currentManagerBonus = hasManagerBonus ? 7000 : 0;
    const totalSalary = 29500 + currentAllowance + currentManagerBonus + achievementBonus + excessBonus + teamBonus;

    return { achievementBonus, currentLevel, excessBonus, teamTotalPerformance, teamBonus, currentAllowance, currentManagerBonus, totalSalary };
  }, [personalPerformance, teamMembers, hasAllowance, hasManagerBonus]);

  const addMember = () => {
    const newId = teamMembers.length ? Math.max(...teamMembers.map(m => m.id)) + 1 : 1;
    setTeamMembers([...teamMembers, { id: newId, name: `新成員`, performance: 0 }]);
  };

  const removeMember = (id) => setTeamMembers(teamMembers.filter(m => m.id !== id));

const PartnerCalculator = ({ onBack }) => {
  const [revenue, setRevenue] = useState(4537485);
  const [teachingHours, setTeachingHours] = useState(140);
  const [adminMonths, setAdminMonths] = useState(0);

  const TIERS = [
    { limit: 2500000, rate: 0.007, label: '0~250萬' },
    { limit: 3000000, rate: 0.025, label: '250~300萬' },
    { limit: 3150000, rate: 0.020, label: '300~315萬' },
    { limit: 3700000, rate: 0.025, label: '315~370萬' },
    { limit: 3950000, rate: 0.030, label: '370~395萬' },
    { limit: 4200000, rate: 0.040, label: '395~420萬' },
    { limit: 4600000, rate: 0.045, label: '420~460萬' },
    { limit: 5500000, rate: 0.080, label: '460~550萬' },
    { limit: 7000000, rate: 0.120, label: '550~700萬' },
  ];

  const results = useMemo(() => {
    const r = Number(revenue) || 0;
    const h = Number(teachingHours) || 0;
    const am = Math.min(Math.max(Number(adminMonths) || 0, 0), 12);

    let potentialBonus = 0;
    let breakdown = [];
    let currentTier = null;
    let lastLimit = 0;

    for (let i = 0; i < TIERS.length; i++) {
      const tier = TIERS[i];
      if (r > lastLimit) {
        const amountInTier = Math.min(r, tier.limit) - lastLimit;
        const bonusInTier = amountInTier * tier.rate;
        potentialBonus += bonusInTier;
        breakdown.push({
          label: tier.label,
          amount: amountInTier,
          rate: tier.rate,
          bonus: bonusInTier
        });
        if (r <= tier.limit) {
          currentTier = tier;
          break;
        }
      }
      lastLimit = tier.limit;
    }

    const hoursDeducted = am * 8;
    const adjustedTarget = Math.max(0, 140 - hoursDeducted);
    const realizationRate = adjustedTarget > 0 ? Math.min(h / adjustedTarget, 1) : 1;
    const finalPayout = potentialBonus * realizationRate;

    // 較舊制計算
    const oldBonus = 28590;
    const increment = finalPayout - oldBonus;
    const incrementRate = oldBonus > 0 ? (increment / oldBonus) * 100 : 0;

    return { potentialBonus, realizationRate, finalPayout, hoursDeducted, adjustedTarget, breakdown, currentTier, increment, incrementRate };
  }, [revenue, teachingHours, adminMonths]);

  return (
    <div style={{ maxWidth: '1200px', margin: '0 auto', padding: '24px 16px' }}>
      <button onClick={onBack} style={{ background: 'none', border: 'none', color: '#4f46e5', cursor: 'pointer', fontSize: '14px', fontWeight: '500', marginBottom: '24px' }}>
        ← 返回職位選擇
      </button>

      <div style={{ background: 'linear-gradient(to right, #fef3c7, #f8fafc)', borderRadius: '16px', padding: '24px', border: '1px solid #fbbf24', marginBottom: '24px' }}>

        <p style={{ color: '#4b5563' }}>業績分層 + 教學時數 + 店務優待機制</p>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(400px, 1fr))', gap: '24px' }}>
        <div>
          <div style={{ background: 'white', borderRadius: '12px', padding: '20px', border: '1px solid #e2e8f0', marginBottom: '20px' }}>
            <h3 style={{ fontSize: '18px', fontWeight: 'bold', marginBottom: '16px' }}>年度業績與教學</h3>
            
            <div style={{ marginBottom: '16px' }}>
              <label style={{ display: 'block', fontSize: '12px', fontWeight: '700', color: '#64748b', marginBottom: '8px' }}>年度預計總業績 (NT$)</label>
              <div style={{ position: 'relative' }}>
                <span style={{ position: 'absolute', left: '12px', top: '50%', transform: 'translateY(-50%)', color: '#cbd5e1', fontSize: '20px' }}>$</span>
                <input 
                  type="number" 
                  value={revenue}
                  onChange={(e) => { const v = e.target.value; setRevenue(v === "" ? "" : parseFloat(v) || 0); }}
                  style={{ width: '100%', fontSize: '20px', fontWeight: '900', padding: '12px 12px 12px 36px', background: '#fef3c7', border: '2px solid transparent', borderRadius: '8px', outline: 'none', boxSizing: 'border-box' }}
                />
              </div>
              {results.currentTier && (
                <p style={{ fontSize: '11px', color: '#92400e', marginTop: '6px', fontWeight: 'bold' }}>
                  目前所在區間：{results.currentTier.label} ({(results.currentTier.rate * 100).toFixed(1)}%)
                </p>
              )}
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
              <div>
                <label style={{ display: 'block', fontSize: '12px', fontWeight: '700', color: '#64748b', marginBottom: '8px' }}>店務月份</label>
                <input 
                  type="number" 
                  min="0" max="12"
                  value={adminMonths}
                  onChange={(e) => { const v = e.target.value; setAdminMonths(v === "" ? "" : parseFloat(v) || 0); }}
                  style={{ width: '100%', fontSize: '18px', fontWeight: '900', padding: '12px', background: '#dbeafe', border: '2px solid transparent', borderRadius: '8px', outline: 'none', boxSizing: 'border-box' }}
                />
                <p style={{ fontSize: '11px', color: '#1e40af', marginTop: '6px' }}>抵扣：{results.hoursDeducted} 小時</p>
              </div>

              <div>
                <label style={{ display: 'block', fontSize: '12px', fontWeight: '700', color: '#64748b', marginBottom: '8px' }}>教學時數</label>
                <input 
                  type="number"

                />
                <p style={{ fontSize: '11px', color: '#065f46', marginTop: '6px' }}>目標：{results.adjustedTarget} 小時</p>

            </div>

              {results.breakdown.map((item, idx) => (
